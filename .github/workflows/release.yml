name: Release Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable zip
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync project environment
        run: uv sync

      - name: Build portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = ""
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_portable.ps1 -Version $version

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dancing-log-portable
          path: |
            dist/releases/*.zip
            dist/releases/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/*.zip
            dist/releases/*.sha256
