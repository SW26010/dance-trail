name: Release Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable zip
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Normalize Windows test environment
        shell: pwsh
        run: |
          $tempPath = Join-Path $env:GITHUB_WORKSPACE ".tmp"
          New-Item -ItemType Directory -Force -Path $tempPath | Out-Null
          "TEMP=$tempPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tempPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          tzutil.exe /s "China Standard Time"
          if ((Get-TimeZone).Id -ne "China Standard Time") {
            throw "Failed to configure the release test timezone"
          }

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install "uv==0.11.26"

      - name: Sync project environment
        run: uv sync --locked --group release --cache-dir .uv-cache

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Web UI test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Check and build Fluent React Web UI
        run: |
          pnpm check:webui
          pnpm build:webui
          git diff --exit-code -- dance_trail/webui_dist

      - name: Verify accessibility release report and evaluated assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          $tagName = $env:TAG_NAME
          if ($tagName -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release tag is not an accepted version tag: $tagName"
          }
          $report = Join-Path "docs/accessibility/release-reports" "$tagName.md"
          if (-not (Test-Path -LiteralPath $report)) {
            throw "Missing WCAG-EM release report: $report"
          }
          uv run --locked --cache-dir .uv-cache python scripts/verify_accessibility_report.py $report --require-pass --revision-must-be-ancestor-of $env:RELEASE_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw "Accessibility release report verification failed: $report"
          }

      - name: Run Web UI accessibility acceptance
        run: pnpm test:a11y

      - name: Build portable zip
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            $version = ""
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_portable.ps1 -Version $version

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dance-trail-portable
          path: |
            dist/releases/*.zip
            dist/releases/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/releases/*.zip
            dist/releases/*.sha256
