name: Web UI Accessibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wcag22-aa:
    name: Playwright, axe, ARIA, and keyboard acceptance
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Normalize Windows test environment
        shell: pwsh
        run: |
          $tempPath = Join-Path $env:GITHUB_WORKSPACE ".tmp"
          New-Item -ItemType Directory -Force -Path $tempPath | Out-Null
          "TEMP=$tempPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tempPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          tzutil.exe /s "China Standard Time"
          if ((Get-TimeZone).Id -ne "China Standard Time") {
            throw "Failed to configure the Web UI test timezone"
          }

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install "uv==0.11.26"

      - name: Sync Python environment
        run: uv sync --locked --cache-dir .uv-cache

      - name: Check Python lint and types
        run: |
          uv run --locked --cache-dir .uv-cache ruff check dance_trail tests scripts
          uv run --locked --cache-dir .uv-cache ty check dance_trail

      - name: Run Python unit tests
        run: uv run --locked --cache-dir .uv-cache python -m unittest discover

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Web UI test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Verify portable license collection
        run: >-
          uv run --locked --group release --cache-dir .uv-cache python
          scripts/collect_licenses.py --output build/license-check

      - name: Check and build Fluent React Web UI
        run: |
          pnpm check:webui
          pnpm build:webui
          git diff --exit-code -- dance_trail/webui_dist

      - name: Verify accessibility evidence for material Web UI changes
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_REVISION: ${{ github.sha }}
        run: >-
          uv run --locked --cache-dir .uv-cache python
          scripts/verify_accessibility_changes.py
          --base-revision $env:BASE_REVISION
          --head-revision $env:HEAD_REVISION

      - name: Run Web UI accessibility acceptance
        run: pnpm test:a11y

      - name: Run Web UI development-mode acceptance
        run: pnpm test:webui-dev

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-accessibility-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
