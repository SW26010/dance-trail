name: Web UI Accessibility

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  wcag22-aa:
    name: Playwright, axe, ARIA, and keyboard acceptance
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install "uv==0.11.26"

      - name: Sync Python environment
        run: uv sync --locked --cache-dir .uv-cache

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Web UI test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run Web UI accessibility acceptance
        run: pnpm test:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-accessibility-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
