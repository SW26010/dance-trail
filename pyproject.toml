[project]
name = "dancing-log"
version = "0.7.0"
description = "舞蹈歌曲记录与数据分析工具"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tzlocal>=5.4.4,<6",
]

[project.optional-dependencies]
recording-tools = [
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "ty>=0.0.61",
]
release = [
    "pyinstaller==6.21.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
